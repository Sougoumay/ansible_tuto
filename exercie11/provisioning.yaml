---
- name: Provisioning servers
  hosts: all
  become: yes
  tasks: 
    - name: Install ntp agent on centos
      yum:
        name: httpd
        state: present
      when: ansible_distribution == "CentOS"

    - name: Install multiple item on Ubuntu
      apt:
        name: "{{item}}"
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
      loop:
        - nginx
        - git
        - zip
        - unzip
        - wget


