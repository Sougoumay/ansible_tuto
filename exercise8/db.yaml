---
- name: DBserver setup
  hosts: dbservers
  become: yes
    #vars:
    #dbname: accounts
    #dbuser: bob
    #dbpass: Admin12345
  tasks:
    - debug:
        var: dbname
    - debug:
        msg: "The dbname is {{dbname}}"
    - name: Install mariadb-server
      ansible.builtin.apt:
        name: mariadb-server
        state: present

    - name: Install PyMySql
      ansible.builtin.apt:
        name: python3-pymysql
        state: present

    - name: Start mariadb-server
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    - name: Create a new database with name 'accounts'  
      community.mysql.mysql_db:
        name: "{{dbname}}"
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Create database user with name 'bob' and password 'Admin12345' with all database privileges  
      community.mysql.mysql_user:
        name: "{{dbuser}}"
        password: "{{dbpass}}"
        priv: '*.*:ALL'
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      register: dbout

    - name: print dbout variable
      debug:
        var: dbout
